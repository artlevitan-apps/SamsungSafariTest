<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10121a"><title>Samsung Safari Test</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#10121a;color:#f6f7fa;margin:0;padding:24px;max-width:520px;margin:auto}h1{font-size:27px}p,small{color:#aab0c0;line-height:1.5}input,button{font:inherit;border-radius:13px;padding:14px;border:1px solid #343a49}input{background:#1c2230;color:white;width:100%;box-sizing:border-box}button{background:#2b3446;color:white;cursor:pointer}button:disabled{opacity:.35}.primary{background:#4386ef;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#171d28;padding:14px;border-radius:12px;font-size:12px;min-height:100px}label{display:block;margin:15px 0 6px} .muted{font-size:13px}</style></head><body><h1>Samsung · Safari Test</h1><p>Проверка прямого подключения iPhone → телевизор. iPhone и TV должны быть в одной сети.</p><label for="ip">IP телевизора</label><input id="ip" value="192.168.0.101" inputmode="decimal"><div class="row"><button class="primary" id="wss">WSS · 8002</button><button id="ws">WS · 8001</button></div><div class="grid"><button class="key" data-key="KEY_HOME" disabled>⌂ Home</button><button class="key" data-key="KEY_RETURN" disabled>↩ Назад</button><button class="key" data-key="KEY_VOLUP" disabled>Громче +</button><button class="key" data-key="KEY_VOLDOWN" disabled>Тише −</button><button class="key" data-key="KEY_MENU" disabled>Настройки</button><button class="key" data-key="KEY_MUTE" disabled>Без звука</button></div><h3>Журнал подключения</h3><pre id="log"></pre><p class="muted">Проверка использует локальный WebSocket API Samsung. Некоторые прошивки и браузеры блокируют соединение. Ошибка соединения не означает, что телевизор неисправен.</p><script>const logEl=document.getElementById('log');let sock=null;let connected=false;function log(x){logEl.textContent+=new Date().toLocaleTimeString()+' · '+x+'\n';logEl.scrollTop=logEl.scrollHeight}function setConnected(v){connected=v;document.querySelectorAll('.key').forEach(b=>b.disabled=!v)}function connect(secure){setConnected(false);if(sock){try{sock.close()}catch(e){}}const ip=document.getElementById('ip').value.trim();if(!/^[a-zA-Z0-9.:-]+$/.test(ip)){log('Неверный адрес');return}const name=btoa('Samsung Safari Test');const url=(secure?'wss':'ws')+'://'+ip+':'+(secure?'8002':'8001')+'/api/v2/channels/samsung.remote.control?name='+encodeURIComponent(name);log('Пробуем '+(secure?'WSS:8002':'WS:8001'));try{const s=new WebSocket(url);sock=s;let opened=false;s.onopen=()=>{opened=true;setConnected(true);log('WebSocket открыт. Если на ТВ появится запрос — разреши доступ.')};s.onmessage=e=>{try{const m=JSON.parse(e.data);log('TV: '+(m.event||'сообщение'));if(m.event==='ms.channel.unauthorized'){setConnected(false);log('Телевизор отказал в доступе')}}catch{log('Сообщение от телевизора')}};s.onerror=()=>log('Ошибка WebSocket. Safari может блокировать соединение или ТВ недоступен.');s.onclose=e=>{setConnected(false);log('Соединение закрыто: '+e.code+(opened?'':' (не удалось открыть)'))}}catch(e){log('Браузер заблокировал попытку: '+e.message)}}document.getElementById('wss').onclick=()=>connect(true);document.getElementById('ws').onclick=()=>connect(false);document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{if(!connected||!sock||sock.readyState!==1)return;const key=b.dataset.key;sock.send(JSON.stringify({method:'ms.remote.control',params:{Cmd:'Click',DataOfCmd:key,Option:'false',TypeOfRemote:'SendRemoteKey'}}));log('Отправлено '+key)});log('Страница готова. Нажми WSS · 8002.');</script></body></html>
